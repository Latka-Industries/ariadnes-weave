# Prose / block spacing (points unless noted as a factor).

[paragraph]
gap_after = 10.0

[heading]
leading_factor = 1.35
gap_after = 8.0

[quote]
indent = 18.0

[code]
leading_factor = 1.25
gap_after = 10.0

[list]
indent_per_depth = 18.0
item_leading_factor = 1.35

[figure]
gap_after = 6.0
alt_gap_after = 10.0

[wrap]
body_leading_factor = 1.35
min_width = 36.0
