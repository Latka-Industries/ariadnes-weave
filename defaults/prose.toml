# Prose / block spacing (points unless noted as a factor).

[paragraph]
gap_after = 10.0
text_align = "left"

[heading]
leading_factor = 1.35
gap_after = 8.0

[quote]
indent = 18.0
italic = true

[code]
leading_factor = 1.25
gap_after = 10.0

[list]
indent_per_depth = 18.0
item_leading_factor = 1.35
end_gutter = 0.0

[indent]
step = 0.0

[figure]
gap_after = 6.0
alt_gap_after = 10.0
gap_after_image = 2.0
gap_before = 6.0
gap_after_title = 18.0
align = "center"
max_width_factor = 1.0
title_align = "follow"
title_text_align = "center"

[caption]
italic = true
size_factor = 0.9
leading_factor = 1.15
gap_after = 6.0
band = "match_figure"
text_align = "left"
overflow = "hard_break"

# Soft wrap / hyphenation / widow-orphan (THI-394).
[wrap]
body_leading_factor = 1.35
min_width = 36.0
hyphenate = true
orphan_lines = 2
widow_lines = 2

# Newspaper / article body columns (THI-391). Distinct from deck [columns].
[body_columns]
gap = 18.0

# Review line-number gutter (THI-415). Off by default; pack `[body].line_numbers`.
[body]
line_numbers = false
line_number_gutter = 18.0
line_number_size_factor = 0.7

# Titled band (THI-412 / THI-414). Same paint for every `callout_kind`.
[callout]
indent = 0.0
rule_thickness = 1.5
rule_gap = 8.0
title_gap = 4.0
