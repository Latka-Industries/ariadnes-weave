# Page chrome (header/footer, clearance, stroke/fill gray).
# Format tokens: {page}, {pages}, {title}, {heading} (THI-409).
# {page} follows [numbers].style; {page_roman}/{page_Roman} always roman (THI-413).
# Optional format_even / align_even on header/footer for twoside chrome.
# Footnote band sits above footer chrome (THI-410).

[footer]
font_size = 9.0
y_margin_factor = 0.45
enabled = true
align = "center"
format = "{page} / {pages}"

[header]
font_size = 9.0
y_margin_factor = 0.55
enabled = false
align = "left"
format = "{title}"

[content]
bottom_clearance = 18.0
top_clearance = 0.0

[chrome]
stroke_gray = 0.12
fill_gray = 0.12

[footnote]
max_band = 72.0
marker_scale = 0.7
rule_thickness = 0.4
size_factor = 0.8
leading_factor = 1.15
gap_before_rule = 4.0

# `{page}` style (THI-413). Tokens `{page_roman}` / `{page_Roman}` always roman.
[numbers]
style = "arabic"
