[package]
name = "ariadnes-weave"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["AHurowitz <latkaindustries@gmail.com>"]
description = "Native deterministic print engine for Tessera — print IR → PDF"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latka-Industries/ariadnes-weave"
readme = "README.md"
keywords = ["pdf", "print", "pagination", "layout", "tessera"]
categories = ["encoding", "text-processing", "graphics"]

[lib]
path = "src/lib.rs"

[dependencies]
pdf-writer = "0.15.0"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
ttf-parser = "0.25.1"

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
