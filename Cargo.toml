[package]
name = "ariadnes-weave"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
authors = ["AHurowitz <latkaindustries@gmail.com>"]
description = "Native deterministic print engine for Tessera — print IR → PDF"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latka-Industries/ariadnes-weave"
readme = "README.md"
keywords = ["pdf", "print", "pagination", "layout", "tessera"]
categories = ["encoding", "text-processing", "graphics"]

[lib]
path = "src/lib.rs"

[features]
default = []
# Sealed CJK fallback faces (large; e.g. Noto CJK). Off by default.
cjk = []
# Sealed emoji fallback face(s). Off by default; may need color-font emit later.
emoji = []
# Font Awesome Free icon faces in the sealed pack (modest size).
icons = []

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.8.9"
pdf-writer = "0.15.0"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subsetter = { version = "0.2.6", default-features = false }
thiserror = "2.0.19"
ttf-parser = "0.25.1"

[dev-dependencies]
anyhow = "1.0.104"
sha2 = "0.10"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
