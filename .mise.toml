[tools]
rust = "1.95"

[tasks.samples]
description = "Regenerate sample PDFs under tmp/"
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p tmp
# Core corpus + 0.2.6–0.2.7 spotchecks
for ex in prose math_sample layout_flush caption_spotcheck figure_pagination_spotcheck; do
  cargo run --quiet --example "$ex"
done
# Integration tests that also drop sample PDFs into tmp/
cargo test --quiet --test hello_world --test prose_sample -- --nocapture
for t in figure_png_embeds_xobject deck_v0_is_landscape_16x9 two_column_slide_emits_both_sides; do
  cargo test --quiet --lib "$t" -- --nocapture
done
# Optional sealed packs (CJK / emoji)
for t in sealed_cjk_fallback_embeds_in_pdf sealed_emoji_fallback_embeds_in_pdf; do
  cargo test --quiet --features cjk,emoji --lib "$t" -- --nocapture
done
"""
